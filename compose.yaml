services:
  client:
    image: meabhisingh/thread-client
    container_name: client
    ports:
      - "127.0.0.1:4173:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    image: meabhisingh/thread-server
    container_name: server
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MONGO_URI: mongodb://db/Thread
      PORT: 5000
      NODE_ENV: production
      TRUST_PROXY: 1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in the environment}
      CLOUD_NAME: ${CLOUD_NAME:?Set CLOUD_NAME in the environment}
      API_KEY: ${API_KEY:?Set API_KEY in the environment}
      API_SECRET: ${API_SECRET:?Set API_SECRET in the environment}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mongo
    container_name: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodbdata:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodbdata:
    driver: local
